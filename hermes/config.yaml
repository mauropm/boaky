# Hermes Agent — Boaky deployment profile.
# Mounted into the container at /opt/data/config.yaml (HERMES_HOME=/opt/data).
# The API key lives next to this file in .env (both gitignored).

_config_version: 50

# Conversation and generation are entirely Hermes' job. Boaky never calls
# an LLM; Hermes generates answers strictly from Boaky's retrieved passages.
model:
  # Named provider below (OpenAI-compatible OpenCode Go endpoint).
  provider: "custom:opencode-go"
  # DeepSeek V4.1 Flash: chosen for long-context retrieval-augmented generation.
  # Must be an exact OpenCode Go model id (`/zen/go/v1/models`), not a display
  # name — "DeepSeek-Flash-V4.1" and "*-free" variants are rejected upstream.
  default: "deepseek-v4.1-flash"

providers:
  opencode-go:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: ${OPENCODE_GO_API_KEY}

# The bridge between the two products: Boaky's MCP tool surface.
# Boaky exposes five read-only tools over streamable HTTP:
# search_books, list_books, get_passages, get_book_metadata, check_evidence.
mcp_servers:
  boaky:
    url: http://boaky:8000/mcp
    # Boaky is always up before Hermes (depends_on: service_healthy),
    # so eager connect is fine.
    timeout: 60
agent:
  max_turns: 150
  reasoning_effort: medium
browser:
  backend: browser-use
computer_use:
  backend: cua
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - a2a
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
