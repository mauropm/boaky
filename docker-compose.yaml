# Boaky — local-first book evidence engine, with Hermes as the conversational layer.
#
# Persistence model:
#   ./books          read-only source TXT files (never modified by Boaky)
#   ./data/index     SQLite database (WAL) — survives rebuild/recreation
#   ./data/metadata  per-book JSON metadata
#
# Start:      docker compose up -d --build
# Index:      docker compose run --rm boaky index
# Recreate:   docker compose up -d --force-recreate   (NEVER use `down -v`)
services:
  boaky:
    build: .
    image: boaky:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./books:/books:ro
      - ./data/index:/data/index
      - ./data/metadata:/data/metadata
    environment:
      BOAKY_HTTP_ADDR: "0.0.0.0:8000"
      BOAKY_LOG_LEVEL: "info"
      # No API keys: boaky never calls out to any provider. Generation
      # configuration lives on the Hermes side.
    networks:
      - boaky-internal
    healthcheck:
      test: ["CMD", "boaky", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    # Hermes' container CMD is its interactive session; it exits without a
    # pty ("Input is not a terminal"). Attach with:
    #   docker compose exec -it hermes hermes
    # or run one-shot queries:
    #   docker compose run --rm hermes hermes -z "question"
    tty: true
    stdin_open: true
    # entrypoint.sh copies the staged config/secrets into HERMES_HOME on boot
    # and then execs the stock image dispatcher. "$@" (the container CMD) is
    # forwarded untouched, so `docker compose run --rm hermes hermes -z "..."`
    # still works.
    entrypoint: ["/opt/hermes-config/entrypoint.sh"]
    volumes:
      # Hermes' runtime state (sessions, caches, state.db) lives in a volume so
      # the repo stays clean.
      - hermes-home:/opt/data:rw
      # Staged config + secrets, mounted as a DIRECTORY rather than one bind
      # per file. Single-file binds are resolved once at container start, so an
      # atomic-write editor (temp + rename) silently leaves the container
      # serving the OLD key/config until it is recreated. See entrypoint.sh.
      # Read-only: ./hermes/config.yaml in the repo is the source of truth.
      - ./hermes:/opt/hermes-config:ro
    depends_on:
      boaky:
        condition: service_healthy
    networks:
      # outbound: reach OpenCode Go / opencode.ai (the internal net alone
      # would block external provider connectivity)
      - outbound
      # boaky-internal: MCP tool calls to boaky, nothing published to host
      - boaky-internal

networks:
  boaky-internal:
    internal: true
  outbound:
    driver: bridge

volumes:
  hermes-home:
